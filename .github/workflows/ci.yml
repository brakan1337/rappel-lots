name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (SQLite puis PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rappels
          POSTGRES_USER: rappels
          POSTGRES_PASSWORD: rappels
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rappels -d rappels"
          --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Style et erreurs (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Aucune migration oubliée
        run: python manage.py makemigrations --check --dry-run
      - name: Tests sur SQLite
        run: pytest
      - name: Tests sur une vraie base PostgreSQL
        run: pytest
        env:
          DATABASE_URL: postgres://rappels:rappels@localhost:5432/rappels

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t rappel-lots .
